<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اطلب من المطاعم و المقاهي في قطر عبر تطبيق سنونو - اسرع توصيل!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'DINNextArabic';
        src: url('/fonts/DINNextLTArabic-Heavy.ttf') format('truetype');
        font-display: swap;
        font-weight: 900;
        font-style: normal;
      }

      @font-face {
        font-family: 'arabicFont';
        src: url('/fonts/DINNextLTArabic-Heavy.ttf') format('truetype');
        font-display: swap;
        font-weight: 700 900;
        font-style: normal;
      }
      @font-face {
        font-family: 'arabicFont';
        src: local('Cairo'), url('https://fonts.gstatic.com/s/cairo/v28/SLXgc1nY6HkvangtZmpQdkhzfH5lkSscQyyS4J0.woff2') format('woff2');
        font-display: swap;
        font-weight: 400 600;
      }
      :root {
        --font-arabic: 'arabicFont', 'Cairo', system-ui, sans-serif;
        --font-arabic-heavy: 'DINNextArabic', 'arabicFont', 'Cairo', system-ui, sans-serif;
        --font-latin: 'Inter', system-ui, sans-serif;
      }
      html[dir='rtl'] body { font-family: var(--font-arabic); }
      html[dir='ltr'] body { font-family: var(--font-latin); }
      .font-arabic-heavy { font-family: var(--font-arabic-heavy); font-weight: 900; }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              snoonu: {
                DEFAULT: '#d90217',
                dark: '#b00112',
                light: '#ff1a30',
              },
              charcoal: '#1f1f23',
            },
            fontFamily: {
              arabic: ['arabicFont', 'Cairo', 'system-ui', 'sans-serif'],
              latin: ['Inter', 'system-ui', 'sans-serif'],
            },
          },
        },
      }
    </script>
  </head>
  <body class="bg-gray-50 text-charcoal antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
